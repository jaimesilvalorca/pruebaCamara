  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

late(-50%,-50%);width:5px;height:5px;border-radius:50%;background:#fff;\"><\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ hasLoginError }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:13px;color:oklch(50% 0.17 25);background:oklch(96% 0.03 25);border:1px solid oklch(85% 0.06 25);border-radius:3px;padding:9px 12px;\">RUN o clave incorrectos.<\u002Fdiv>\n              <\u002Fsc-if>\n\n              <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14px;\">\n                <a href=\"#\" onclick=\"{{ noop }}\">Recupera tu clave<\u002Fa>\n                <a href=\"#\" onclick=\"{{ noop }}\">Solicita tu clave<\u002Fa>\n              <\u002Fdiv>\n\n              <button onclick=\"{{ login }}\" style=\"width:100%;background:oklch(65% 0.09 255);color:#fff;border:none;border-radius:3px;padding:16px 20px;font-size:16px;font-weight:500;letter-spacing:0.02em;cursor:pointer;text-decoration:underline;\">INGRESA<\u002Fbutton>\n\n              <div style=\"text-align:center;font-size:14px;\"><a href=\"#\" onclick=\"{{ noop }}\">¿Necesitas ayuda?<\u002Fa><\u002Fdiv>\n              <div style=\"text-align:center;font-size:12px;color:oklch(58% 0.01 255);border-top:1px solid oklch(92% 0.008 255);padding-top:14px;\">Demo: usa <strong>admin<\u002Fstrong> / <strong>admin<\u002Fstrong><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isNotLogin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:#fff;border-bottom:1px solid oklch(88% 0.008 255);\">\n      <div style=\"display:flex;align-items:center;gap:10px;cursor:pointer;\" onclick=\"{{ goDashboard }}\">\n        <div style=\"width:30px;height:30px;border-radius:8px;background:{{ primaryColor nt;\"><\u002Fdiv><div style=\"background:{{ primaryColor }};\"><\u002Fdiv><div style=\"background:{{ primaryColor }};\"><\u002Fdiv>\n            <div style=\"background:{{ primaryColor }};\"><\u002Fdiv><div style=\"background:transparent;\"><\u002Fdiv><div style=\"background:{{ primaryColor }};\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:16.5px;font-weight:700;\">Escanear código QR<\u002Fdiv>\n            <div style=\"font-size:13px;color:oklch(45% 0.01 255);margin-top:3px;\">Si el elemento no existe, se registra como nuevo. Si ya existe, se muestran sus datos y se agrega un nuevo registro de custodia.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;\">\n          <div style=\"font-size:14.5px;font-weight:700;\">Elementos recientes<\u002Fdiv>\n          <a href=\"#\" onclick=\"{{ goHistory }}\" style=\"font-size:13px;\">Ver todo el historial →<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:1px;background:oklch(88% 0.008 255);border:1px solid oklch(88% 0.008 255);border-radius:6px;overflow:hidden;\">\n          <sc-for list=\"{{ recentItems }}\" as=\"it\" hint-placeholder-count=\"2\">\n            <div onclick=\"{{ it.openFn }}\" style=\"cursor:pointer;background:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;\">\n              <div>\n                <div style=\"font-size:14px;font-weight:600;\">{{ it.description }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:oklch(45% 0.01 255);margin-top:2px;\">{{ it.id }} · {{ it.caseNumber }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:12.5px;color:oklch(45% 0.01 255);white-space:nowrap;\">{{ it.lastAction }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isScan }}\" hint-placeholder-val=\"{{ false }}\">\n        <button onclick=\"{{ goDashboard }}\" style=\"background:none;border:none;color:oklch(45% 0.01 255);font-size:13.5px;cursor:pointer;margin-bottom:16px;padding:0;\">← Volver<\u002Fbutton>\n        <h2 style=\"font-size:19px;font-weight:700;margin:0 0 4px;\">Escanear código QR<\u002Fh2>\n        <div style=\"font-size:13.5px;color:oklch(45% 0.01 255);margin-bottom:20px;\">Apunte la cámara al código QR de la etiqueta de evidencia.<\u002Fdiv>\n\n        <div style=\"max-width:420px;margin:0 auto;\">\n          <div style=\"position:relative;width:100%;aspect-ratio:3/4;background:#111;border-radius:8px;overflow:hidden;\">\n            <sc-if value=\"{{ cameraOk }}\" hint-placeholder-val=\"{{ false }}\">\n              <video ref=\"{{ videoRef }}\" sc-camel-auto-play=\"{{ true }}\" sc-camel-plays-inline=\"{{ true }}\" muted=\"{{ true }}\" style=\"width:100%;height:100%;object-fit:cover;background:#111;\"><\u002Fvideo>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ cameraNotOk }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#9aa3ad;\">\n                <div style=\"width:34px;height:34px;border:2px solid #5a6470;border-radius:6px;\"><\u002Fdiv>\n                <div style=\"font-size:12.5px;text-align:center;padding:0 30px;\">Cámara no disponible{{ cameraErrorSuffix }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"position:absolute;inset:0;pointer-events:none;\">\n              <div style=\"position:absolute;top:36px;left:36px;width:26px;height:26px;border-top:3px solid #fff;border-left:3px solid #fff;border-radius:4px 0 0 0;\"><\u002Fdiv>\n              <div style=\"position:absolute;top:36px;right:36px;width:26px;height:26px;border-top:3px solid #fff;border-right:3px solid #fff;border-radius:0 4px 0 0;\"><\u002Fdiv>\n              <div style=\"position:absolute;bottom:36px;left:36px;width:26px;height:26px;border-bottom:3px solid #fff;border-left:3px solid #fff;border-radius:0 0 0 4px;\"><\u002Fdiv>\n              <div style=\"position:absolute;bottom:36px;right:36px;width:26px;height:26px;border-bottom:3px solid #fff;border-right:3px solid #fff;border-radius:0 0 4px 0;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12.5px;color:#fff;animation:pulse 1.6s ease-in-out infinite;\">Buscando código QR…<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:18px;\">\n            <div style=\"font-size:12px;color:oklch(55% 0.01 255);text-align:center;\">Sin etiqueta a mano? Simule una lectura:<\u002Fdiv>\n            <div style=\"display:flex;gap:10px;\">\n              <button onclick=\"{{ simulateExisting }}\" style=\"flex:1;background:#fff;border:1px solid oklch(85% 0.008 255);color:oklch(35% 0.01 255);border-radius:4px;padding:12px 14px;font-size:13.5px;font-weight:600;cursor:pointer;\">QR existente<\u002Fbutton>\n              <button onclick=\"{{ simulateNew }}\" style=\"flex:1;background:{{ primaryColor }};color:#fff;border:none;border-radius:4px;padding:12px 14px;font-size:13.5px;font-weight:600;cursor:pointer;\">QR nuevo<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isForm }}\" hint-placeholder-val=\"{{ false }}\">\n        <button onclick=\"{{ goDashboard }}\" style=\"background:none;border:none;color:oklch(45% 0.01 255);font-size:13.5px;cursor:pointer;margin-bottom:16px;padding:0;\">← Volver<\u002Fbutton>\n        <h2 style=\"font-size:19px;font-weight:700;margin:0 0 20px;\">{{ formTitle }}<\u002Fh2>\n\n        <div style=\"background:oklch(94% 0.015 255);border:1px solid oklch(88% 0.008 255);border-radius:6px;padding:16px 18px;margin-bottom:20px;\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:oklch(45% 0.01 255);margin-bottom:10px;\">Datos leídos del código QR<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;\">\n            <div><div style=\"font-size:11.5px;color:oklch(50% 0.01 255);\">ID de elemento<\u002Fdiv><div style=\"font-size:14px;font-weight:600;\">{{ formData.id }}<\u002Fdiv><\u002Fdiv>\n            <sc-if value=\"{{ isExisting }}\" hint-placeholder-val=\"{{ false }}\">\n              <div><div style=\"font-size:11.5px;color:oklch(50% 0.01 255);\">N° de caso/parte<\u002Fdiv><div style=\"font-size:14px;font-weight:600;\">{{ formData.caseNumber }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ isExisting }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"max-width:640px;display:flex;flex-direction:column;gap:26px;margin-bottom:30px;\">\n            <div>\n              <div style=\"font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:oklch(45% 0.01 255);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid oklch(90% 0.008 255);\">Datos de la especie registrada<\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid oklch(88% 0.008 255);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:16px;\">\n                <div>\n                  <div style=\"font-size:15.5px;font-weight:700;\">{{ activeItem.description }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:oklch(45% 0.01 255);margin-top:2px;\">{{ activeItem.id }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px 20px;padding-top:14px;border-top:1px solid oklch(93% 0.008 255);\">\n                  <sc-for list=\"{{ activeItemFields }}\" as=\"f\" hint-placeholder-count=\"6\">\n                    <div>\n                      <div style=\"font-size:11.5px;color:oklch(50% 0.01 255);\">{{ f.label }}<\u002Fdiv>\n                      <div style=\"font-size:14px;font-weight:600;\">{{ f.value }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <sc-if value=\"{{ activeItemHasPhoto }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding-top:14px;border-top:1px solid oklch(93% 0.008 255);\">\n                    <div style=\"font-size:11.5px;color:oklch(50% 0.01 255);margin-bottom:6px;\">Fotografía registrada<\u002Fdiv>\n                    <div style=\"width:180px;height:130px;border-radius:5px;border:1px solid oklch(90% 0.008 255);background-color:oklch(95% 0.008 255);background-size:cover;background-position:center;background-image:{{ activeItemPhotoBg }};\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid oklch(90% 0.008 255);\">\n                <div style=\"font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:oklch(45% 0.01 255);\">Cadena de custodia registrada<\u002Fdiv>\n                <div style=\"font-size:12px;color:oklch(55% 0.01 255);\">{{ activeChainCount }} eslabones<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"position:relative;padding-left:20px;border-left:2px solid oklch(90% 0.008 255);display:flex;flex-direction:column;gap:16px;\">\n                <sc-for list=\"{{ activeChainDetailed }}\" as=\"ev\" hint-placeholder-count=\"2\">\n                  <div style=\"position:relative;\">\n                    <div style=\"position:absolute;left:-26px;top:3px;width:9px;height:9px;border-radius:50%;background:{{ primaryColor }};\"><\u002Fdiv>\n                    <div style=\"font-size:13.5px;font-weight:600;\">{{ ev.action }}<\u002Fdiv>\n                    <div style=\"font-size:12px;color:oklch(55% 0.01 255);margin-bottom:4px;\">{{ ev.date }}<\u002Fdiv>\n                    <sc-if value=\"{{ ev.hasTransfer }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"font-size:12.5px;color:oklch(40% 0.01 255);\">Entrega {{ ev.entregaLine }} → Recibe {{ ev.recibeLine }}<\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ ev.noTransfer }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div style=\"font-size:12.5px;color:oklch(45% 0.01 255);\">{{ ev.officer }}<\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ ev.hasObs }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"font-size:12.5px;color:oklch(50% 0.01 255);margin-top:3px;\">{{ ev.observaciones }}<\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ ev.hasFirma }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"margin-top:6px;width:120px;height:48px;border:1px solid oklch(92% 0.008 255);border-radius:4px;background-color:#fff;background-size:contain;background-repeat:no-repeat;background-position:center;background-image:{{ ev.firmaBg }};\"><\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isNew }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"max-width:640px;display:flex;flex-direction:column;gap:26px;\">\n\n            <div>\n              <div style=\"font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:oklch(45% 0.01 255);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid oklch(90% 0.008 255);\">Identificación de la causa<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;\">\n                <label style=\"display:flex;flex-direction:column;gap:5px;\">\n                  <span style=\"font-size:12.5px;font-weight:600;color:oklch(35% 0.01 255);\">RUC<\u002Fspan>\n                  <input value=\"{{ formData.ruc }}\" oninput=\"{{ onRucChange }}\" placeholder=\"2400123456-8\" style=\"padding:10px 12px;border:1px solid oklch(85% 0.008 255);border-radius:4px;font-size:14px;\">\n                <\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:5px;\">\n                  <span style=\"font-size:12.5px;font-weight:600;color:oklch(35% 0.01 255);\">RIT<\u002Fspan>\n                  <input value=\"{{ formData.rit }}\" oninput=\"{{ onRitChange }}\" placeholder=\"O-1234-2024\" style=\"padding:10px 12px;border:1px solid oklch(85% 0.008 255);border-radius:4px;font-size:14px;\">\n                <\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:5px;\">\n                  <span style=\"font-size:12.5px;font-weight:600;color:oklch(35% 0.01 255);\">Folio<\u002Fspan>\n                  <input value=\"{{ formData.folio }}\" oninput=\"{{ onFolioChange }}\" style=\"padding:10px 12px;border:1px solid oklch(85% 0.008 255);border-radius:4px;font-size:14px;\">\n                <\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:oklch(45% 0.01 255);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid oklch(90% 0.008 255);\">Antecedentes del levantamiento<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:14px;\">\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;\">\n                  <label style=\"display:flex;flex-direction:column;gap:5px;\">\n                    <span style=\"font-size:12.5px;font-weight:600;color:oklch(35% 0.01 255);\">Delito<\u002Fspan>\n                    <input value=\"{{ formData.delito }}\" oninput=\"{{ onDelitoChange }}\" placeholder=\"Ej: Robo con violencia\" style=\"padding:10px 12px;border:1px solid oklch(85% 0.008 255);border-radius:4px;font-size:14px;\">\n                  <\u002Flabel>\n                  <label style=\"display:flex;flex-direction:column;gap:5px;\">\n                    <span style=\"font-size:12.5px;font-weight:600;color:oklch(35% 0.01 255);\">Fecha<\u002Fspan>\n                    <input value=\"{{ formData.fecha }}\" oninput=\"{{ onFechaChange }}\" type=\"date\" style=\"padding:10px 12px;border:1px solid oklch(85% 0.008 255);border-radius:4px;font-size:14px;\">\n                  <\u002Flabel>\n                <\u002Fdiv>\n                <label style=\"display:flex;flex-direction:column;gap:5px;\">\n                  <span style=\"font-size:12.5px;font-weight:600;color:oklch(35% 0.01 255);\">Dirección del S.S.<\u002Fspan>\n                  <input value=\"{{ formData.direccionSS }}\" oninput=\"{{ onDireccionSSChange }}\" placeholder=\"Calle, número, comuna\" style=\"padding:10px 12px;border:1px solid oklch(85% 0.008 255);border-radius:4px;font-size:14px;\">\n                <\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:5px;\">\n                  <span style=\"font-size:12.5px;font-weight:600;color:oklch(35% 0.01 255);\">Lugar exacto del levantamiento u obtención<\u002Fspan>\n                  <input value=\"{{ formData.lugarExacto }}\" oninput=\"{{ onLugarExactoChange }}\" placeholder=\"Ej: velador dormitorio principal\" style=\"padding:10px 12px;border:1px solid oklch(85% 0.008 255);border-radius:4px;font-size:14px;\">\n                <\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:5px;\">\n                  <span style=\"font-size:12.5px;font-weight:600;color:oklch(35% 0.01 255);\">Descripción<\u002Fspan>\n                  <textarea value=\"{{ formData.descripcionGeneral }}\" oninput=\"{{ onDescripcionGeneralChange }}\" rows=\"3\" style=\"padding:10px 12px;border:1px solid oklch(85% 0.008 255);border-radius:4px;font-size:14px;resize:vertical;\"><\u002Ftextarea>\n                <\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:oklch(45% 0.01 255);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid oklch(90% 0.008 255);\">Funcionario y parte<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:14px;\">\n                <label style=\"display:flex;flex-direction:column;gap:5px;max-width:280px;\">\n                  <span style=\"font-size:12.5px;font-weight:600;color:oklch(35% 0.01 255);\">N° Parte<\u002Fspan>\n                  <input value=\"{{ formData.numeroParte }}\" oninput=\"{{ onNumeroParteChange }}\" style=\"padding:10px 12px;border:1px solid oklch(85% 0.008 255);border-radius:4px;font-size:14px;\">\n                <\u002Flabel>\n\n                <div style=\"background:oklch(96% 0.008 255);border:1px solid oklch(90% 0.008 255);border-radius:5px;padding:14px 16px;\">\n                  <div style=\"font-size:11.5px;color:oklch(50% 0.01 255);margin-bottom:10px;\">Datos tomados de la sesión<\u002Fdiv>\n                  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 20px;\">\n                    <div><div style=\"font-size:11.5px;color:oklch(50% 0.01 255);\">Unidad policial<\u002Fdiv><div style=\"font-size:14px;font-weight:600;\">{{ session.unidad }}<\u002Fdiv><\u002Fdiv>\n                    <div><div style=\"font-size:11.5px;color:oklch(50% 0.01 255);\">Levantada por<\u002Fdiv><div style=\"font-size:14px;font-weight:600;\">{{ session.nombre }}<\u002Fdiv><\u002Fdiv>\n                    <div><div style=\"font-size:11.5px;color:oklch(50% 0.01 255);\">RUN<\u002Fdiv><div style=\"font-size:14px;font-weight:600;\">{{ session.run }}<\u002Fdiv><\u002Fdiv>\n                    <div><div style=\"font-size:11.5px;color:oklch(50% 0.01 255);\">Cargo<\u002Fdiv><div style=\"font-size:14px;font-weight:600;\">{{ session.cargo }}<\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <label style=\"display:flex;flex-direction:column;gap:5px;\">\n                  <span style=\"font-size:12.5px;font-weight:600;color:oklch(35% 0.01 255);\">Observaciones<\u002Fspan>\n                  <textarea value=\"{{ formData.observaciones }}\" oninput=\"{{ onObservacionesChange }}\" rows=\"3\" style=\"padding:10px 12px;border:1px solid oklch(85% 0.008 255);border-radius:4px;font-size:14px;resize:vertical;\"><\u002Ftextarea>\n                <\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:oklch(45% 0.01 255);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid oklch(90% 0.008 255);\">Descripción de la especie<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:14px;\">\n                <textarea value=\"{{ formData.description }}\" oninput=\"{{ onDescriptionChange }}\" rows=\"4\" placeholder=\"Tipo, marca, modelo, serie, color, estado, cantidad…\" style=\"padding:10px 12px;border:1px solid oklch(85% 0.008 255);border-radius:4px;font-size:14px;resize:vertical;\"><\u002Ftextarea>\n\n                <div>\n                  <div style=\"font-size:12.5px;font-weight:600;color:oklch(35% 0.01 255);margin-bottom:7px;\">Fotografía de la especie<\u002Fdiv>\n                  <sc-if value=\"{{ hasPhoto }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;flex-direction:column;gap:10px;align-items:flex-start;\">\n                      <div style=\"width:100%;max-width:320px;height:220px;border-radius:5px;border:1px solid oklch(88% 0.008 255);background-color:oklch(94% 0.008 255);background-size:cover;background-position:center;background-image:{{ photoBg }};\"><\u002Fdiv>\n                      <button onclick=\"{{ clearPhoto }}\" style=\"background:none;border:1px solid oklch(85% 0.008 255);border-radius:4px;padding:8px 14px;font-size:13px;color:oklch(38% 0.01 255);cursor:pointer;\">Quitar fotografía<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ noPhoto }}\" hint-placeholder-val=\"{{ true }}\">\n                    <label style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:140px;border:1.5px dashed oklch(78% 0.01 255);border-radius:6px;cursor:pointer;background:#fff;max-width:320px;\">\n                      <div style=\"width:30px;height:24px;border:2px solid oklch(60% 0.02 255);border-radius:4px;position:relative;\">\n                        <div style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:9px;height:9px;border:2px solid oklch(60% 0.02 255);border-radius:50%;\"><\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"font-size:13px;color:oklch(45% 0.01 255);\">Tomar o subir fotografía<\u002Fdiv>\n                      <input type=\"file\" accept=\"image/*\" capture=\"environment\" onchange=\"{{ onPhotoChange }}\" style=\"display:none;\">\n                    <\u002Flabel>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <button onclick=\"{{ submitForm }}\" style=\"background:{{ primaryColor }};color:#fff;border:none;border-radius:4px;padding:14px 20px;font-size:14.5px;font-weight:600;cursor:pointer;\">Registrar especie en cadena de custodia<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n serMedia({ video: true })\n        .then(attach)\n        .catch((err) => this.setState({ cameraError: true, cameraErrorMsg: (err && err.name) || 'Error' })));\n  }\n  stopCamera() {\n    if (this.stream) { this.stream.getTracks().forEach((t) => t.stop()); this.stream = null; }\n  }\n\n  sigPos(e) {\n    const c = this.sigRef.current;\n    const r = c.getBoundingClientRect();\n    return { x: (e.clientX - r.left) * (c.width / r.width), y: (e.clientY - r.top) * (c.height / r.height) };\n  }\n  sigDown(e) {\n    const c = this.sigRef.current; if (!c) return;\n    e.preventDefault();\n    if (c.setPointerCapture && e.pointerId != null) { try { c.setPointerCapture(e.pointerId); } catch (err) {} }\n    this.sigDrawing = true; this.sigHasInk = true;\n    const ctx = c.getContext('2d');\n    ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1a2b45';\n    const p = this.sigPos(e);\n    ctx.beginPath(); ctx.moveTo(p.x, p.y);\n  }\n  sigMove(e) {\n    if (!this.sigDrawing) return;\n    const c = this.sigRef.current; if (!c) return;\n    e.preventDefault();\n    const p = this.sigPos(e);\n    const ctx = c.getContext('2d');\n    ctx.lineTo(p.x, p.y); ctx.stroke();\n  }\n  sigUp() { this.sigDrawing = false; }\n  clearSig() {\n    const c = this.sigRef.current; if (!c) return;\n    c.getContext('2d').clearRect(0, 0, c.width, c.height);\n    this.sigHasInk = false;\n  }\n  sigDataUrl() {\n    const c = this.sigRef.current;\n    return (c && this.sigHasInk) ? c.toDataURL('image/png') : null;\n  }\n\n  nowStr() {\n    const d = new Date();\n    const p = (n) => String(n).padStart(2, '0');\n    return `${p(d.getDate())}-${p(d.getMonth() + 1)}-${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;\n  }\n\n  login() {\n    const run = (this.state.loginRun || '').trim().toLowerCase();\n    const pass = (this.state.loginPass || '').trim();\n    if (run !== 'admin' || pass !== 'admin') { this.setState({ loginError: true }); return; }\n    this.setState({ isLoading: true, loginError: false });\n    setTimeout(() => this.setState({\n      isLoading: false, screen: 'dashboard',\n      userName: 'Cabo 1° L. Fernández',\n      session: { nombre: 'Luis Fernández Rojas', run: '15.482.301-7', cargo: 'Cabo 1°', unidad: '2ª Comisaría Providencia' }\n    }), 1000);\n  }\n  logout() { this.setState({ screen: 'login', userName: null, loginRun: '', loginPass: '', loginError: false, showPass: false }); }\n  goDashboard() { this.setState({ screen: 'dashboard' }); }\n  goHistory() { this.setState({ screen: 'history' }); }\n  openDetail(id) { const item = this.state.items.find((i) => i.id === id); this.setState({ screen: 'detail', activeItem: item }); }\n\n  startScan() { this.setState({ screen: 'scan' }); }\n\n  startDecodeLoop() {\n    const tick = () => {\n      if (this.state.screen !== 'scan') return;\n      const v = this.videoRef.current;\n      if (v && v.readyState === 4 && window.jsQR) {\n        const c = this.canvas || (this.canvas = document.createElement('canvas'));\n        c.width = v.videoWidth; c.height = v.videoHeight;\n        const ctx = c.getContext('2d');\n        ctx.drawImage(v, 0, 0, c.width, c.height);\n        try {\n          const img = ctx.getImageData(0, 0, c.width, c.height);\n          const code = window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });\n          if (code && code.data) { this.handleQr(code.data); return; }\n        } catch (e) {}\n      }\n      this.decodeTimer = setTimeout(tick, 350);\n    };\n    tick();\n  }\n  stopDecodeLoop() { if (this.decodeTimer) { clearTimeout(this.decodeTimer); this.decodeTimer = null; } }\n\n  parseQr(raw) {\n    const text = String(raw).trim();\n    try {\n      const obj = JSON.parse(text);\n      if (obj && typeof obj === 'object') return obj;\n    } catch (e) {}\n    return { id: text };\n  }\n\n  handleQr(raw) {\n    this.stopDecodeLoop();\n    this.stopCamera();\n    const payload = this.parseQr(raw);\n    const existing = this.state.items.find((i) => i.id === payload.id);\n    if (existing) {\n      const d = new Date();\n      const p = (n) => String(n).padStart(2, '0');\n      this.sigHasInk = false;\n      const s = this.state.session || {};\n      this.setState({\n        screen: 'form', formMode: 'existing', activeItem: existing,\n        formData: {\n          id: existing.id, caseNumber: existing.caseNumber, description: existing.description,\n          fecha: `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`,\n          hora: `${p(d.getHours())}:${p(d.getMinutes())}`,\n          entrega: s.nombre || '', entregaRun: s.run || '',\n          recibe: '', recibeRun: '',\n          motivo: 'Traslado', observaciones: '',\n          location: '', officer: this.state.userName, date: this.nowStr(), actionNote: 'Traslado'\n        }\n      });\n    } else {\n      const d = new Date();\n      const p = (n) => String(n).padStart(2, '0');\n      this.setState({\n        screen: 'form', formMode: 'new', activeItem: null,\n        formData: {\n          id: payload.id,\n          ruc: payload.ruc || '', rit: payload.rit || '', folio: payload.folio || '',\n          delito: '', fecha: `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`,\n          direccionSS: '', lugarExacto: '', descripcionGeneral: '',\n          numeroParte: '', observaciones: '',\n          description: payload.description || '', photo: null,\n          location: payload.location || '', officer: this.state.userName,\n          date: this.nowStr(), actionNote: 'Incautación inicial'\n        }\n      });\n    }\n  }\n\n  simulateExisting() { this.handleQr(this.state.items[0].id); }\n  simulateNew() {\n    const n = 200 + this.state.items.length;\n    this.handleQr('CC-2024-0' + n);\n  }\n\n  updateField(field, value) { this.setState((s) => ({ formData: Object.assign({}, s.formData, { [field]: value }) })); }\n\n  submitForm() {\n    const { formData, formMode, activeItem, items } = this.state;\n    const isExisting = formMode === 'existing';\n    const entry = isExisting ? {\n      action: formData.motivo === 'Peritaje' ? 'Traslado para peritaje' : formData.motivo === 'Custodia' ? 'Traslado a custodia' : 'Traslado',\n      officer: formData.recibe || formData.officer,\n      date: (formData.fecha || '') + ' ' + (formData.hora || ''),\n      entrega: formData.entrega, entregaRun: formData.entregaRun,\n      recibe: formData.recibe, recibeRun: formData.recibeRun,\n      motivo: formData.motivo,\n      observaciones: formData.observaciones || '',\n      firma: this.sigDataUrl()\n    } : { officer: formData.officer, date: formData.date, action: formData.actionNote, observaciones: formData.observaciones || '' };\n    let updatedItems, updatedItem;\n    if (formMode === 'new') {\n      updatedItem = Object.assign({}, formData, {\n        caseNumber: formData.ruc ? 'RUC ' + formData.ruc : (formData.rit || formData.folio || 'Sin causa'),\n        description: formData.description || 'Especie sin descripción',\n        location: formData.lugarExacto || formData.direccionSS || '',\n        createdDate: formData.date,\n        unidad: (this.state.session || {}).unidad,\n        levantadaPor: (this.state.session || {}).nombre,\n        chain: [entry]\n      });\n      updatedItems = [updatedItem, ...items];\n    } else {\n      updatedItems = items.map((it) => it.id === activeItem.id ? Object.assign({}, it, { location: formData.recibe ? ('En poder de ' + formData.recibe) : it.location, chain: it.chain.concat([entry]) }) : it);\n      updatedItem = updatedItems.find((it) => it.id === activeItem.id);\n    }\n    this.setState({ items: updatedItems, screen: 'success', lastEntry: { item: updatedItem, entry }, activeItem: updatedItem });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const primaryColor = this.props.primaryColor || 'oklch(42% 0.13 255)';\n    const successColor = 'oklch(45% 0.13 150)';\n    const withOpen = (it) => Object.assign({}, it, {\n      lastAction: it.chain[it.chain.length - 1].action,\n      chainCount: it.chain.length,\n      openFn: () => this.openDetail(it.id)\n    });\n    return {\n      isLogin: s.screen === 'login',\n      isNotLogin: s.screen !== 'login',\n      isLoading: s.isLoading,\n      isNotLoading: !s.isLoading,\n      isDashboard: s.screen === 'dashboard',\n      isScan: s.screen === 'scan',\n      isForm: s.screen === 'form',\n      isSuccess: s.screen === 'success',\n      isHistory: s.screen === 'history',\n      isDetail: s.screen === 'detail',\n      isNew: s.formMode === 'new',\n      isExisting: s.formMode === 'existing',\n      institutionName: this.props.institutionName || 'Cadena de Custodia',\n      userName: s.userName,\n      primaryColor, successColor,\n      login: () => this.login(),\n      loginRun: s.loginRun,\n      loginPass: s.loginPass,\n      hasLoginError: s.loginError,\n      passInputType: s.showPass ? 'text' : 'password',\n      togglePass: () => this.setState((st) => ({ showPass: !st.showPass })),\n      onRunChange: (e) => this.setState({ loginRun: e.target.value, loginError: false }),\n      onPassChange: (e) => this.setState({ loginPass: e.target.value, loginError: false }),\n      onPassKeyDown: (e) => { if (e.key === 'Enter') this.login(); },\n      noop: (e) => e.preventDefault(),\n      logout: () => this.logout(),\n      goDashboard: () => this.goDashboard(),\n      goHistory: () => this.goHistory(),\n      startScan: () => this.startScan(),\n      simulateExisting: () => this.simulateExisting(),\n      simulateNew: () => this.simulateNew(),\n      submitForm: () => this.submitForm(),\n      videoRef: this.videoRef,\n      cameraOk: !s.cameraError,\n      cameraNotOk: s.cameraError,\n      cameraErrorSuffix: s.cameraErrorMsg ? ' (' + s.cameraErrorMsg + ')' : ' en esta vista previa',\n      recentItems: s.items.slice(0, 3).map(withOpen),\n      historyItems: s.items.map(withOpen),\n      activeItem: s.activeItem,\n      activeChain: s.activeItem ? s.activeItem.chain : [],\n      activeChainCount: s.activeItem ? s.activeItem.chain.length : 0,\n      activeItemHasPhoto: !!(s.activeItem && s.activeItem.photo),\n      activeItemPhotoBg: (s.activeItem && s.activeItem.photo) ? 'url(\"' + s.activeItem.photo + '\")' : 'none',\n      activeItemFields: (() => {\n        const it = s.activeItem || {};\n        return [\n          ['RUC', it.ruc], ['RIT', it.rit], ['Folio', it.folio],\n          ['N° Parte', it.numeroParte], ['Delito', it.delito],\n          ['Fecha levantamiento', it.fecha], ['Dirección del S.S.', it.direccionSS],\n          ['Lugar exacto', it.lugarExacto], ['Unidad policial', it.unidad],\n          ['Levantada por', it.levantadaPor], ['Ubicación actual', it.location]\n        ].filter((p) => p[1]).map((p) => ({ label: p[0], value: p[1] }));\n      })(),\n      activeChainDetailed: (s.activeItem ? s.activeItem.chain : []).map((ev) => Object.assign({}, ev, {\n        hasTransfer: !!(ev.entrega || ev.recibe),\n        noTransfer: !(ev.entrega || ev.recibe),\n        entregaLine: [ev.entrega, ev.entregaRun].filter(Boolean).join(' · '),\n        recibeLine: [ev.recibe, ev.recibeRun].filter(Boolean).join(' · '),\n        hasObs: !!ev.observaciones,\n        hasFirma: !!ev.firma,\n        firmaBg: ev.firma ? 'url(\"' + ev.firma + '\")' : 'none'\n      })),\n      formData: s.formData,\n      session: s.session,\n      formTitle: s.formMode === 'new' ? 'Registro de especie incautada' : 'Actualizar cadena de custodia',\n      hasPhoto: !!s.formData.photo,\n      photoBg: s.formData.photo ? 'url(\"' + s.formData.photo + '\")' : 'none',\n      noPhoto: !s.formData.photo,\n      clearPhoto: () => this.updateField('photo', null),\n      onPhotoChange: (e) => {\n        const file = e.target.files && e.target.files[0];\n        if (!file) return;\n        const reader = new FileReader();\n        reader.onload = () => this.updateField('photo', reader.result);\n        reader.readAsDataURL(file);\n      },\n      onRucChange: (e) => this.updateField('ruc', e.target.value),\n      onRitChange: (e) => this.updateField('rit', e.target.value),\n      onFolioChange: (e) => this.updateField('folio', e.target.value),\n      onDelitoChange: (e) => this.updateField('delito', e.target.value),\n      onFechaChange: (e) => this.updateField('fecha', e.target.value),\n      onHoraChange: (e) => this.updateField('hora', e.target.value),\n      onEntregaChange: (e) => this.updateField('entrega', e.target.value),\n      onEntregaRunChange: (e) => this.updateField('entregaRun', e.target.value),\n      onRecibeChange: (e) => this.updateField('recibe', e.target.value),\n      onRecibeRunChange: (e) => this.updateField('recibeRun', e.target.value),\n      motivos: ['Peritaje', 'Custodia', 'Traslado'].map((label) => ({\n        label,\n        checked: s.formData.motivo === label,\n        border: s.formData.motivo === label ? 'oklch(60% 0.11 255)' : 'oklch(88% 0.008 255)',\n        bg: s.formData.motivo === label ? 'oklch(96% 0.02 255)' : '#fff',\n        select: () => this.updateField('motivo', label)\n      })),\n      sigRef: this.sigRef,\n      sigW: 840,\n      sigH: 340,\n      sigDown: (e) => this.sigDown(e),\n      sigMove: (e) => this.sigMove(e),\n      sigUp: () => this.sigUp(),\n      clearSig: () => this.clearSig(),\n      onDireccionSSChange: (e) => this.updateField('direccionSS', e.target.value),\n      onLugarExactoChange: (e) => this.updateField('lugarExacto', e.target.value),\n      onDescripcionGeneralChange: (e) => this.updateField('descripcionGeneral', e.target.value),\n      onNumeroParteChange: (e) => this.updateField('numeroParte', e.target.value),\n      onObservacionesChange: (e) => this.updateField('observaciones', e.target.value),\n      onDescriptionChange: (e) => this.updateField('description', e.target.value),\n      onLocationChange: (e) => this.updateField('location', e.target.value),\n      onOfficerChange: (e) => this.updateField('officer', e.target.value),\n      onActionChange: (e) => this.updateField('actionNote', e.target.value),\n      lastEntry: s.lastEntry || { item: { description: '', id: '', caseNumber: '' }, entry: { action: '', officer: '', date: '' } }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
